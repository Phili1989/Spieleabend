(()=>{'use strict';const KEY='unoScoreCash_v1',PRESET=['Marcel','Marvin','Alex','Philipp'],$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],today=()=>new Date().toISOString().slice(0,10),blank=()=>({date:today(),players:[],rounds:[],started:false});let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!state.current)state={dataVersion:1,knownPlayers:[],current:blank(),history:[]};state.dataVersion=1;const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),money=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v||0),totals=(g=state.current)=>g.players.map((_,i)=>g.rounds.reduce((s,r)=>s+(r[i]===''?0:(Number(r[i])||0)),0)),amounts=(g=state.current)=>totals(g).map(v=>Math.round(v/30*100)/100),valid=v=>v!==''&&Number.isFinite(Number(v))&&Number(v)>=0,complete=r=>r&&r.length===state.current.players.length&&r.every(valid),empty=r=>r&&r.every(v=>v==='');function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),1600)}function focusCell(r,p){requestAnimationFrame(()=>{let e=document.querySelector(`.score[data-r="${r}"][data-p="${p}"]`);e?.focus({preventScroll:true});e?.scrollIntoView({block:'center',inline:'center'});if(e?.value)e.select()})}function bars(names,vals,fmt,pct){let sum=vals.reduce((a,b)=>a+b,0),max=Math.max(1,...vals);return names.map((n,i)=>`<div class="barrow"><b>${n}${pct?`<span class="pct">${sum?(vals[i]/sum*100).toFixed(1).replace('.',','):0} %</span>`:''}</b><div class="track"><div class="fill" style="width:${vals[i]/max*100}%"></div></div><b>${fmt(vals[i],i)}</b></div>`).join('')}
function renderTable(){let g=state.current,t=totals(),a=amounts(),h='<thead><tr><th>Runde</th>'+g.players.map(p=>`<th>${p}</th>`).join('')+'</tr></thead><tbody>';g.rounds.forEach((r,ri)=>h+=`<tr><td>${ri+1}</td>${g.players.map((_,pi)=>`<td><input class="score${r[pi]===''?' open':''}" type="number" inputmode="numeric" enterkeyhint="next" min="0" value="${r[pi]??''}" data-r="${ri}" data-p="${pi}"></td>`).join('')}</tr>`);h+=`<tr class="total"><td>Gesamt</td>${t.map(v=>`<td>${v}</td>`).join('')}</tr><tr class="money"><td>Kasse</td>${a.map(v=>`<td>${money(v)}</td>`).join('')}</tr></tbody>`;$('#scoreTable').innerHTML=h}function summary(){let g=state.current;if(!g.started){$('#summary').innerHTML='<div class="muted">Noch kein Spiel gestartet.</div>';return}let t=totals(),a=amounts();$('#summary').innerHTML=`<div class="bars">${bars(g.players,t,(v,i)=>`${v} · ${money(a[i])}`,true)}</div><div class="line"><b>Gesamtkasse</b><b class="green">${money(a.reduce((x,y)=>x+y,0))}</b></div><div class="notice">Enter springt zum nächsten Spieler. Nach einer vollständigen letzten Runde öffnet sich automatisch die nächste.</div>`}function renderGame(){let g=state.current,has=g.players.length||g.started;$('#choice').hidden=has;$('#gameGrid').hidden=!has;$('#gameDate').value=g.date||today();$('#setup').hidden=g.started;$('#play').hidden=!g.started;$('#finish').disabled=!g.started;$('#start').disabled=g.players.length<2;$('#chips').innerHTML=g.players.map((p,i)=>`<span class="chip">${p} <b data-x="${i}">×</b></span>`).join('');if(g.started)renderTable();summary()}
function history(){let m={};state.history.forEach(g=>{let t=totals(g);if(!t.length)return;let lo=Math.min(...t),hi=Math.max(...t);g.players.forEach((p,i)=>{m[p]??={w:0,l:0};if(t[i]===lo)m[p].w++;if(t[i]===hi)m[p].l++})});let e=Object.entries(m);$('#ranks').innerHTML=`<div class="card"><h3>🏆 Siege</h3>${[...e].sort((a,b)=>b[1].w-a[1].w).map(([p,v])=>`<div class="rankrow"><span>${p}</span><b>${v.w}×</b></div>`).join('')}</div><div class="card"><h3>📉 Niederlagen</h3>${[...e].sort((a,b)=>b[1].l-a[1].l).map(([p,v])=>`<div class="rankrow"><span>${p}</span><b>${v.l}×</b></div>`).join('')}</div>`;$('#historyList').innerHTML=state.history.map(g=>`<div class="historyItem"><b>${g.date}</b> · ${g.rounds.length} Runden · ${money(amounts(g).reduce((a,b)=>a+b,0))}</div>`).join('')||'<div class="muted">Noch keine Spieltage.</div>'}function cash(){let per={},total=0;state.history.forEach(g=>{let a=amounts(g);g.players.forEach((p,i)=>per[p]=(per[p]||0)+a[i]);total+=a.reduce((x,y)=>x+y,0)});let e=Object.entries(per).sort((a,b)=>b[1]-a[1]);$('#stats').innerHTML=`<div class="stat">Gesamtkasse<b class="green">${money(total)}</b></div><div class="stat">Spieltage<b>${state.history.length}</b></div><div class="stat">Spieler<b>${e.length}</b></div>`;$('#cashBars').innerHTML=bars(e.map(x=>x[0]),e.map(x=>x[1]),money,false);$('#timeline').innerHTML=state.history.map(g=>`<div class="line"><span>${g.date}</span><b>${money(amounts(g).reduce((a,b)=>a+b,0))}</b></div>`).join('')}function render(){renderGame();history();cash();save()}
function startWith(players){state.current={date:today(),players:[...players],rounds:[players.map(()=>'')],started:true};render();focusCell(0,0)}$('#custom').onclick=()=>{state.current=blank();state.current.players=[];$('#choice').hidden=true;$('#gameGrid').hidden=false;renderGame();setTimeout(()=>$('#player').focus(),0)};$('#uno').onclick=()=>startWith(PRESET);function addPlayer(){let n=$('#player').value.trim();if(!n)return;if(!state.current.players.some(x=>x.toLowerCase()===n.toLowerCase()))state.current.players.push(n);$('#player').value='';render();$('#player').focus()}$('#addPlayer').onclick=addPlayer;$('#player').onkeydown=e=>{if(e.key==='Enter')addPlayer()};$('#chips').onclick=e=>{if(e.target.dataset.x!=null){state.current.players.splice(+e.target.dataset.x,1);render()}};$('#start').onclick=()=>startWith(state.current.players);$('#gameDate').onchange=e=>{state.current.date=e.target.value;save()};function commit(el){let r=+el.dataset.r,p=+el.dataset.p,v=el.value.trim();if(v!==''&&(!Number.isFinite(+v)||+v<0))return false;state.current.rounds[r][p]=v===''?'':Math.round(+v);save();return true}function createRound(focus=true){let g=state.current;if(!g.started)return false;let last=g.rounds.length-1;if(last<0){g.rounds.push(g.players.map(()=>''));render();if(focus)focusCell(0,0);return true}if(empty(g.rounds[last])){toast('Die aktuelle Runde ist bereits bereit.');if(focus)focusCell(last,0);return false}let open=g.rounds[last].findIndex(v=>v==='');if(open>=0){toast('Bitte zuerst die offene Eingabe ergänzen.');if(focus)focusCell(last,open);return false}g.rounds.push(g.players.map(()=>''));render();if(focus)focusCell(last+1,0);return true}$('#newRound').onclick=e=>{e.preventDefault();createRound(true)};$('#scoreTable').addEventListener('keydown',e=>{if(!e.target.classList.contains('score'))return;let el=e.target,r=+el.dataset.r,p=+el.dataset.p;if(e.key!=='Enter'&&e.key!=='Tab')return;e.preventDefault();if(!commit(el))return;if(p<state.current.players.length-1){focusCell(r,p+1);return}let open=state.current.rounds[r].findIndex(v=>v==='');if(open>=0){focusCell(r,open);return}if(r===state.current.rounds.length-1&&complete(state.current.rounds[r]))createRound(true);else if(r<state.current.rounds.length-1)focusCell(r+1,0)});$('#scoreTable').addEventListener('blur',e=>{if(!e.target.classList.contains('score'))return;if(commit(e.target)){e.target.classList.toggle('open',e.target.value==='');summary();let t=totals(),a=amounts();$$('.total td:not(:first-child)').forEach((x,i)=>x.textContent=t[i]);$$('.money td:not(:first-child)').forEach((x,i)=>x.textContent=money(a[i]))}},true);$('#deleteRound').onclick=()=>{if(!state.current.rounds.length)return;if(confirm('Letzte Runde löschen?')){state.current.rounds.pop();if(!state.current.rounds.length)state.current.rounds.push(state.current.players.map(()=>''));render();focusCell(state.current.rounds.length-1,0)}};$('#backChoice').onclick=()=>{if(confirm('Aktuelles Spiel verwerfen?')){state.current=blank();render()}};$('#finish').onclick=()=>{let g=structuredClone(state.current);while(g.rounds.length&&empty(g.rounds[g.rounds.length-1]))g.rounds.pop();if(!g.rounds.length)return toast('Noch keine abgeschlossene Runde.');g.id=Date.now();state.history.push(g);state.current=blank();render();toast('Spieltag gespeichert.')};
$('#exportData').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`UNO_Kasse_Backup_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$('#importData').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.current||!Array.isArray(d.history))throw Error();if(confirm('Lokale Daten ersetzen?')){state=d;render();toast('Daten importiert.')}}catch{toast('Ungültige Sicherungsdatei.')}e.target.value=''};function view(id){$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===id));$$('.view').forEach(v=>v.classList.toggle('on',v.id===id))}$$('nav button').forEach(b=>b.onclick=()=>view(b.dataset.view));render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
